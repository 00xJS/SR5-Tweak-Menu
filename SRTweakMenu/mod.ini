[settings]
; Keyboard key that opens and closes the menu (controller: hold RB, press D-pad Down).
menu_key = F5
; Where the menu is drawn and how big (the game's interface coordinates, 1920x1080).
menu_x = 120
menu_y = 120
menu_line = 34
menu_value_x = 560
menu_width = 1000
menu_scale = 0.9
menu_font = avant_garde_body
; Rows shown at once before the page scrolls.
menu_rows = 11
; Darkness of the panel behind the menu, 0 to 100 (also in Settings).
menu_opacity = 60
; Spicy cheats don't mark your save (also in Settings).
keep_save_clean = true
; Interface document the menu is drawn in.
menu_document = fades
; Development: run TweakMenu\probe_in.lua while the game runs, output in probe_out.txt.
dev_probe = false
